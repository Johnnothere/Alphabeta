<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#1a1a1d;color:#f5f5f7;font-family:Geist,ui-sans-serif,system-ui,sans-serif;position:relative}
  .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%)}
  .orb1{position:absolute;left:12%;top:8%;width:360px;height:360px;border-radius:50%;background:rgba(80,255,150,.13);filter:blur(80px)}
  .orb2{position:absolute;right:10%;bottom:4%;width:400px;height:400px;border-radius:50%;background:rgba(110,180,255,.12);filter:blur(90px)}
  .card{position:absolute;inset:48px;border-radius:32px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.08);padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#9a9aa3}
  .dot{color:#5cf29a}
  h1{margin:0;font-size:104px;line-height:1.0;letter-spacing:-.04em;font-weight:600}
  h1 .m{color:#9a9aa3}
  .sub{margin-top:28px;font-size:30px;color:#9a9aa3;max-width:900px;line-height:1.3}
  .bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:20px;color:#9a9aa3}
  .brand{font-size:30px;font-weight:600;letter-spacing:-.02em;color:#f5f5f7}
  .brand .b{color:#5cf29a}
  .prompt{font-size:22px}
  .prompt .s{color:#5cf29a}
</style></head><body>
<div class="grid"></div><div class="orb1"></div><div class="orb2"></div>
<div class="card">
  <div class="top mono"><span><span class="dot">●</span> status: shipping</span><span>// London · Greenwich · every institution</span></div>
  <div>
    <h1>Build. Ship.<br><span class="m">Help others ship.</span></h1>
    <div class="sub">A cross-disciplinary society of builders. No fuss, no hype — only building things and helping people build theirs.</div>
  </div>
  <div class="bot"><span class="brand">alpha<span class="b">β</span>eta</span><span class="prompt mono"><span class="s">$</span> ./join --no-fuss▍</span></div>
</div>
</body></html>
