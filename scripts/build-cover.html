<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 html,body{margin:0;width:1200px;height:750px;overflow:hidden;font-family:"JetBrains Mono",monospace}
 body{background:#1a1a1d;color:#f5f5f7;position:relative}
 .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 80%)}
 .orb{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px)}
 .o1{left:-80px;top:-100px;background:rgba(80,255,150,.14)}
 .o2{right:-90px;bottom:-120px;background:rgba(110,180,255,.12)}
 .win{position:absolute;inset:90px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 40px 100px -30px rgba(0,0,0,.6);overflow:hidden}
 .bar{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;color:#9a9aa3}
 .dot{width:11px;height:11px;border-radius:50%;background:#3a3a3e}
 .tag{margin-left:12px}
 .body{padding:34px 40px;font-size:21px;line-height:1.85}
 .k{color:#b78bff}.s{color:#5cf29a}.f{color:#7fb5ff}.c{color:#6b6b73}.sig{color:#5cf29a}
 .brand{position:absolute;left:112px;bottom:118px;font-family:Geist,sans-serif;font-weight:600;font-size:30px}
 .brand .b{color:#5cf29a}
</style></head><body>
 <div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div>
 <div class="win">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="tag">alphabeta/site.ts — build · shipping</span></div>
  <div class="body">
   <div><span class="k">export const</span> site = {</div>
   <div>&nbsp;&nbsp;name: <span class="s">"alphabeta.site"</span>,</div>
   <div>&nbsp;&nbsp;stack: [<span class="s">"TypeScript"</span>, <span class="s">"React"</span>, <span class="s">"TanStack"</span>, <span class="s">"Tailwind"</span>],</div>
   <div>&nbsp;&nbsp;backend: <span class="k">null</span>, <span class="c">// static. nothing to break.</span></div>
   <div>&nbsp;&nbsp;status: <span class="f">ship</span>(<span class="s">"it"</span>),</div>
   <div>} <span class="k">satisfies</span> Build;</div>
   <div>&nbsp;</div>
   <div class="c">// build. ship. help others ship.<span class="sig">▍</span></div>
  </div>
 </div>
 <div class="brand">alpha<span class="b">β</span>eta</div>
</body></html>
